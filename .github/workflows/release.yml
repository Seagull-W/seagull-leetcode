name: Release extension
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release or retry (v0.2.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false
jobs:
  metadata:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - name: Validate tag input
        id: tag
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Invalid version tag'; exit 1; }
          echo "value=$TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.value }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Require main ancestry, license, changelog and matching version
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.value }}
        run: node extension/scripts/release-check.cjs --git
  validate:
    needs: metadata
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.metadata.outputs.tag }}
  github-release:
    needs: [metadata, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/download-artifact@v4
        with:
          name: seagull-vsix
          path: work/dist
      - name: Create release and attach tested VSIX (retry supported)
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" work/dist/*.vsix --clobber
          else
            gh release create "$TAG" work/dist/*.vsix --verify-tag --title "$TAG" --notes-file CHANGELOG.md
          fi
  marketplace:
    needs: [metadata, github-release]
    if: vars.MARKETPLACE_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: marketplace
    env:
      AUTH_MODE: ${{ vars.MARKETPLACE_AUTH_MODE || 'oidc' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install publishing tool from lockfile
        working-directory: extension
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: seagull-vsix
          path: work/dist
      - name: Check identity configuration
        env:
          CLIENT: ${{ vars.AZURE_CLIENT_ID }}
          TENANT: ${{ vars.AZURE_TENANT_ID }}
          TOKEN: ${{ secrets.VSCE_PAT }}
        run: |
          case "$AUTH_MODE" in
            oidc) test -n "$CLIENT" && test -n "$TENANT" || { echo '::error::Set AZURE_CLIENT_ID and AZURE_TENANT_ID'; exit 1; } ;;
            pat)
              [[ "$(date -u +%Y-%m-%d)" < '2026-12-01' ]] || { echo '::error::Global PATs are retired; migrate to OIDC'; exit 1; }
              test -n "$TOKEN" || { echo '::error::Add repository secret VSCE_PAT'; exit 1; }
              ;;
            *) echo '::error::MARKETPLACE_AUTH_MODE must be oidc or pat'; exit 1 ;;
          esac
      - uses: azure/login@v3
        if: env.AUTH_MODE == 'oidc'
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      - name: Publish exact tested package
        working-directory: extension
        env:
          VSCE_PAT: ${{ env.AUTH_MODE == 'pat' && secrets.VSCE_PAT || '' }}
        run: |
          PUBLISHER=$(node -p "require('./package.json').publisher")
          if [ "$AUTH_MODE" = oidc ]; then
            npx --no-install vsce verify-pat "$PUBLISHER" --azure-credential
            npx --no-install vsce publish --azure-credential --packagePath ../work/dist/*.vsix --skip-duplicate
          else
            npx --no-install vsce verify-pat "$PUBLISHER"
            npx --no-install vsce publish --packagePath ../work/dist/*.vsix --skip-duplicate
          fi
